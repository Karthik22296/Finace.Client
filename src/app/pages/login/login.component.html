<div class="login-split-container">
  <!-- Left Side: Branding / Visuals -->
  <div class="login-brand-panel">
    <div class="brand-content">
      <mat-icon class="brand-icon">account_balance</mat-icon>
      <h2>Finance.Client</h2>
      <p>Empowering daily cash flow and seamless 100-day microfinance collections.</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="login-form-panel">
    <div class="login-card">
      <div class="elegant-header">
        <h1 class="elegant-title">Welcome back</h1>
        <p class="elegant-subtitle">Sign in to your workspace</p>
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" type="text" placeholder="admin or collector">
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" placeholder="Any password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading" class="login-btn">
          <div class="btn-content">
            <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
            <span>{{ isLoading ? 'Signing in...' : 'Sign in' }}</span>
          </div>
        </button>
      </form>
    </div>
  </div>
</div>
