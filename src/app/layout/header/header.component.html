<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="onToggleSidenav()" aria-label="Toggle sidenav">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">Finance.Client</span>
  <span class="spacer"></span>
  <button mat-button class="user-button">
    <mat-icon style="margin-right: 8px;">account_circle</mat-icon>
    {{ authService.getRole() || 'User' }}
  </button>
  <button mat-icon-button aria-label="Logout" (click)="logout()">
    <mat-icon>exit_to_app</mat-icon>
  </button>
</mat-toolbar>
