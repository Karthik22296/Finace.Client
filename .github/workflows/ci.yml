name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Build, Test & Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
        continue-on-error: true # Tests won't fail the build if not fully set up

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        continue-on-error: true # Prevents build failure if Sonar secrets are pending setup
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Application
        run: npm run build

  code-review:
    name: Code Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: Karthik22296/.github/.github/workflows/pr-review.yml@main
    secrets: inherit

